<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>仙途 · 文字修仙</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="screen-title">
  <div class="title-seal">仙</div>
  <h1 class="title">仙　途</h1>
  <div class="subtitle">九 界 之 上 · 一 念 仙 凡</div>
  <div class="title-btns">
    <button id="btnNew" class="primary">开 始 新 生</button>
    <button id="btnLoad" style="display:none">继 续 前 缘</button>
  </div>
  <div class="title-hint">文字修仙 · 轮回不息 · 一念抉择，因果自偿</div>
</div>

<div id="gate" style="display:none">
  <div class="gate-box">
    <div class="gate-seal">仙</div>
    <h2>仙途 · 封闭测试</h2>
    <p>此版本仅供受邀道友试玩，请输入测试邀请码：</p>
    <input id="gateInput" type="password" placeholder="输入邀请码" autocomplete="off">
    <button id="gateBtn" class="primary">踏入仙途</button>
    <div class="gate-hint">测试邀请码由发起者提供</div>
  </div>
</div>

<div id="screen-create" style="display:none">
  <div class="create-box">
    <h2>天机阁 · 命簿开卷</h2>
    <div class="create-row">
      <label>道号 / 姓名：</label>
      <input id="nameInput" placeholder="输入你的名字，或点击右侧随机" maxlength="12">
      <button id="btnRandName" class="small">随机一名</button>
    </div>
    <div class="create-row">
      <label>身份：</label>
      <button id="btnGenderF" class="gender-btn" onclick="switchGender('女')">♀ 随机女修</button>
      <button id="btnGenderM" class="gender-btn" onclick="switchGender('男')">♂ 随机男修</button>
      <span class="gender-hint">女修与男修各有独立身份、立绘与名字；点选后本页随机内容随之切换。</span>
    </div>
    <div id="createAttr" class="attr-grid"></div>
    <div id="createBg"></div>
    <div id="loopBar" class="create-row" style="justify-content:center;margin-top:10px;font-size:12.5px;color:#a99a72"></div>
    <div class="create-row" style="justify-content:center">
      <button id="btnLoop" class="small">🌀 轮回兑换 / 天道枷锁</button>
    </div>
    <div class="create-row" style="justify-content:center;margin-top:22px">
      <button id="btnReroll" class="danger">重 掷 天 机</button>
      <button id="btnBegin" class="primary">启 程 入 世</button>
    </div>
  </div>
</div>

<div id="screen-game" style="display:none">
  <header>
    <span class="logo">仙途</span>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <button id="btnSide" class="small" title="状态面板"><span class="hicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9.5 5v14"/></svg></span><span class="hlbl">状态</span></button>
    <button id="btnTome" class="small" title="仙途录"><span class="hicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h13a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z"/><path d="M5 17.5h14M9 3.5v14"/></svg></span><span class="hlbl">仙途录</span></button>
    <button id="btnDaily" class="small" title="每日修行"><span class="hicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg></span><span class="hlbl">任务</span></button>
    <button id="btnSave" class="small" title="存档"><span class="hicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4v5.5h6V4M9 20v-6h6v6"/></svg></span><span class="hlbl">存档</span></button>
    <button id="btnHelp" class="small" title="修仙志"><span class="hicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h13a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z"/><path d="M9 8.5a3 3 0 0 1 6 0c0 2-3 2.6-3 4.5"/><circle cx="12" cy="17" r=".6"/></svg></span><span class="hlbl">修仙志</span></button>
  </header>
  <div id="main">
    <aside id="side"></aside>
    <div id="sceneLayer"><div id="sceneVeil"></div></div>
    <section id="story"></section>
  </div>
  <div id="inputrow">
    <input id="freeInput" placeholder="✦ 自由行动：可输入如「修炼」「探索」「坊市」「突破」……" autocomplete="off">
    <button id="btnFree">入 戏</button>
  </div>
  <nav id="tabbar"></nav>
  <div id="scrim"></div>
</div>

<div id="panel">
  <div id="panelBox">
    <div id="panelHead"><span class="panel-seal">⚜️</span><span id="panelTitle"></span><button class="small" onclick="closePanel()">收起</button></div>
    <div id="panelBody"></div>
  </div>
</div>

<div id="cultivate">
  <div class="qi-ambient"></div>
  <div id="cultBox">
    <div id="cultHead"><span id="cultTitle">🧘 闭关修炼</span></div>
    <div id="cultPartner"></div>
    <div id="cultBuffs"></div>
    <div class="cult-progress">
      <div class="cult-day" id="cultDay">第 0 / 0 日</div>
      <div class="bar"><i id="cultBar" style="width:0%"></i></div>
    </div>
    <div id="cultLog"></div>
    <div id="cultFoot">
      <button id="cultMode" class="small" style="display:none">☯️ 双人同修</button>
      <button id="cultAbort" class="small">提前出关</button>
    </div>
  </div>
</div>

<div id="breakthrough">
  <div id="breakScene" class="break-scene"></div>
  <div id="btThunder"></div>
  <div id="btHeart"></div>
  <div id="btAura"></div>
  <div id="breakBox">
    <div id="breakTop">
      <div id="breakPortrait"></div>
      <div id="breakInfo">
        <div id="breakName"></div>
        <div id="breakRealm"></div>
        <div class="bt-qi-ring"></div>
      </div>
    </div>
    <div id="breakLog"></div>
    <div class="cult-progress"><div class="cult-day" id="breakDay"></div><div class="bar"><i id="breakBar" style="width:0%"></i></div></div>
    <div style="margin-top:8px;text-align:center"><button id="breakSkip" class="small">⏭️ 跳过演出</button></div>
  </div>
</div>

<div id="battle">
  <div id="battleBox">
    <div id="battleHead">⚔️ 遭遇战</div>
    <div class="bside fig-side">
      <div id="bEnemyFig"></div>
      <div style="flex:1;min-width:0">
        <div class="bname" id="bEnemyName"></div>
        <div class="bar bhp"><i id="bEnemyBar" style="width:100%"></i></div>
        <div class="bhpnum" id="bEnemyHp"></div>
      </div>
    </div>
    <div class="bvs">⚔ 战 ⚔</div>
    <div class="bside fig-side">
      <div id="bPlayerFig"></div>
      <div style="flex:1;min-width:0">
        <div class="bname" id="bPlayerName"></div>
        <div class="bar bhp mine"><i id="bPlayerBar" style="width:100%"></i></div>
        <div class="bhpnum" id="bPlayerHp"></div>
      </div>
    </div>
    <div id="battleLog"></div>
    <div id="battleResult" style="display:none"></div>
    <div id="battleFoot"><button id="battleContinue" class="primary" style="display:none">继 续</button></div>
  </div>
</div>

<div id="ending">
  <div id="endingBox"></div>
</div>

<div id="guide">
  <div id="guideBox">
    <h3 id="guideTitle"></h3>
    <div id="guideBody"></div>
    <div id="guideNav">
      <button id="guidePrev" class="small" style="display:none">上一步</button>
      <span id="guideDots"></span>
      <button id="guideNext" class="primary">下一步</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>


<script src="js/core/utils.js"></script>
<script src="js/core/world.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/equip.js"></script>
<script src="js/data/pills.js"></script>
<script src="js/data/cult.js"></script>
<script src="js/core/schema.js"></script>
<script src="js/core/content.js"></script>
<script src="js/core/persona.js"></script>
<script src="js/core/narratives.js"></script>
<script src="js/core/gate.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/systems/mechanics.js"></script>
  <script src="js/core/profile.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/systems/quests.js"></script>
  <script src="js/data/exploreEvents.js"></script>
  <script src="js/data/storyEvents.js"></script>
  <script src="js/data/map.js"></script>
  <script src="js/systems/npc.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/character.js"></script>
  <script src="js/ui/tabs.js"></script>
<script src="js/ui/create.js"></script>
<script src="js/ui/fx.js"></script>
<script src="js/ui/transition.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/ui/reward.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/systems/cultivation.js"></script>
  <script src="js/systems/breakthrough.js"></script>
  <script src="js/systems/explore.js"></script>
  <script src="js/systems/combat.js"></script>
  <script src="js/systems/dungeon.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/systems/market.js"></script>
<script src="js/systems/sect.js"></script>
<script src="js/systems/social.js"></script>
<script src="js/systems/romance.js"></script>
<script src="js/systems/craft.js"></script>
  <script src="js/systems/equip.js"></script>
  <script src="js/systems/pills.js"></script>
  <script src="js/systems/rest.js"></script>
<script src="js/systems/freeact.js"></script>
<script src="js/api/ai-bridge.js"></script>
<script src="js/systems/death.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/ui/help.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
    if(reg.waiting){try{toast('✨ 新版本已就绪，刷新后生效')}catch(e){}}
  }).catch(function(e){console.warn('SW 注册失败（file:// 或离线环境属正常）',e)});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    try{toast('✨ 仙途已更新至新版本')}catch(e){}
  });
})}
</script>
</body>
<div id="veil"></div>
</html>
